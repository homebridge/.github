name: Publish & Release

permissions:
  id-token: write
  contents: write

on:
  workflow_call:
    inputs:
      release_type:
        required: true
        type: string
      version:
        required: false
        type: string
      max_attempts:
        required: false
        type: number
        default: 5
      is_esm:
        required: true
        type: boolean
    secrets:
      NPM_TOKEN:
        required: true

jobs:
  create_github_release:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.ensure-version.outputs.NPM_VERSION }}
      NPM_VERSION: ${{ steps.ensure-publishable-version.outputs.NPM_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Download ensure-publishable-version script  
        run: |
          mkdir -p .github/scripts
          wget -q https://raw.githubusercontent.com/homebridge/.github/latest/.github/scripts/ensure-publishable-version.sh -O .github/scripts/ensure-publishable-version.sh
          chmod +x .github/scripts/ensure-publishable-version.sh || true

      - name: Ensure version consistency
        id: ensure-version
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")

          if [ -z "$INPUT_VERSION" ]; then
            echo "No input version provided, using package.json version: $PKG_VERSION"
            INPUT_VERSION="$PKG_VERSION"
          fi

          echo "Input version: $INPUT_VERSION"
          echo "package.json version: $PKG_VERSION"

          # Sync package.json if needed
          if [ "$PKG_VERSION" != "$INPUT_VERSION" ]; then
            echo "Syncing package.json version to $INPUT_VERSION"
            npm version "$INPUT_VERSION" --no-git-tag-version
          fi

          echo "NPM_VERSION=$INPUT_VERSION" >> $GITHUB_OUTPUT

      - name: Ensure publishable version (multi-attempt)
        id: ensure-publishable-version
        run: |
          bash .github/scripts/ensure-publishable-version.sh "${{ inputs.release_type }}" "${{ inputs.max_attempts }}"

      - name: Log final package.json and selected tag
        run: |
          echo "Final package.json contents:"
          cat package.json
          echo "Selected release tag: v${{ steps.ensure-publishable-version.outputs.NPM_VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ensure-publishable-version.outputs.NPM_VERSION }}
          prerelease: ${{ inputs.release_type != 'latest' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    needs: [create_github_release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Adjust version (ESM)
        if: ${{ inputs.is_esm }}
        run: |
          mkdir -p .github/scripts
          wget -q https://raw.githubusercontent.com/homebridge/.github/latest/.github/scripts/npm-version-script-esm-auto.js -O .github/scripts/npm-version-script-esm-auto.js
          chmod +x .github/scripts/npm-version-script-esm-auto.js || true
          node .github/scripts/npm-version-script-esm-auto.js ${{ github.ref }} ${{ inputs.release_type }}

      - name: Adjust version (CJS)
        if: ${{ !inputs.is_esm }}
        run: |
          mkdir -p .github/scripts
          wget -q https://raw.githubusercontent.com/homebridge/.github/latest/.github/scripts/npm-version-script-auto.js -O .github/scripts/npm-version-script-auto.js
          chmod +x .github/scripts/npm-version-script-auto.js || true
          node .github/scripts/npm-version-script-auto.js ${{ github.ref }} ${{ inputs.release_type }}

      - name: Sync package.json to release version
        run: |
          set -euo pipefail
          RELEASE_VERSION="${{ needs.create_github_release.outputs.NPM_VERSION }}"
          if [ -z "$RELEASE_VERSION" ]; then
            echo "No release version found from create_github_release job"
            exit 1
          fi

          # Read current package.json version
          PKG_VERSION=$(node -p "require('./package.json').version")

          echo "Current package.json version: $PKG_VERSION"
          echo "Desired release version: $RELEASE_VERSION"

          if [ "$PKG_VERSION" = "$RELEASE_VERSION" ]; then
            echo "package.json already at $RELEASE_VERSION - skipping npm version"
          else
            echo "Setting package.json version to $RELEASE_VERSION"
            npm version "$RELEASE_VERSION" --no-git-tag-version
          fi

      - name: Log package.json before publish
        run: |
          echo "package.json before publish:"
          cat package.json

      - name: Publish to NPM
        run: npm publish --access public --tag=${{ inputs.release_type }} --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Return NPM Package Version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

      - name: Published
        run: echo "::notice::Published on NPM - ${{ steps.package-version.outputs.current-version }}"

    outputs:
      NPM_VERSION: ${{ steps.package-version.outputs.current-version }}