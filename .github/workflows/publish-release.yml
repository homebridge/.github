name: Publish & Release

permissions:
  id-token: write
  contents: write

on:
  workflow_call:
    inputs:
      release_type:
        required: true
        type: string
      version:
        required: false
        type: string
      version_bump:
        required: false
        type: string
        default: ''
      version_override:
        required: false
        type: string
        default: ''
      max_attempts:
        required: false
        type: number
        default: 5
      is_esm:
        required: true
        type: boolean
    secrets:
      NPM_TOKEN:
        required: false
        description: "(Optional) NPM access token. If not provided, OIDC/Trusted Publishers will be used."

jobs:
  create_github_release:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.ensure-version.outputs.NPM_VERSION }}
      NPM_VERSION: ${{ steps.ensure-publishable-version.outputs.NPM_VERSION }}
    steps:
      - uses: actions/checkout@v7

      # Download package.json and package-lock.json from previous job


      - name: Download package.json and lockfile artifacts
        uses: actions/download-artifact@v8
        with:
          name: package-artifacts
          path: .

      - name: Download version artifact
        uses: actions/download-artifact@v8
        with:
          name: version
          path: .

      - name: Read version from file
        id: read-version
        run: |
          VERSION=$(cat version.txt)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Debug ensure-publishable-version.sh presence
        run: |
          echo "Listing $RUNNER_TEMP/release-scripts:"
          mkdir -p "$RUNNER_TEMP/release-scripts"
          ls -l "$RUNNER_TEMP/release-scripts"
          echo "First 20 lines of ensure-publishable-version.sh:"
          head -20 "$RUNNER_TEMP/release-scripts/ensure-publishable-version.sh" || echo "Script not found"
          echo "Shell version:"
          bash --version

      - name: List workspace files after artifact download
        run: |
          echo "[DEBUG] Files in workspace after artifact download:"
          ls -lR .
          echo "[DEBUG] Contents of package.json:"
          cat package.json || echo "package.json not found"
          echo "[DEBUG] Contents of package-lock.json:"
          cat package-lock.json || echo "package-lock.json not found"

      - name: Download ensure-publishable-version script
        run: |
          mkdir -p "$RUNNER_TEMP/release-scripts"
          wget -q https://raw.githubusercontent.com/homebridge/.github/latest/.github/scripts/ensure-publishable-version.sh -O "$RUNNER_TEMP/release-scripts/ensure-publishable-version.sh"
          chmod +x "$RUNNER_TEMP/release-scripts/ensure-publishable-version.sh" || true

      - name: Ensure version consistency
        id: ensure-version
        run: |
          set -euo pipefail
          INPUT_VERSION="${{ steps.read-version.outputs.version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")

          if [ -z "$INPUT_VERSION" ]; then
            echo "No input version provided, using package.json version: $PKG_VERSION"
            INPUT_VERSION="$PKG_VERSION"
          fi

          echo "Input version: $INPUT_VERSION"
          echo "package.json version: $PKG_VERSION"

          # Sync package.json if needed
          if [ "$PKG_VERSION" != "$INPUT_VERSION" ]; then
            echo "Syncing package.json version to $INPUT_VERSION"
            npm version "$INPUT_VERSION" --no-git-tag-version
          fi

          echo "NPM_VERSION=$INPUT_VERSION" >> $GITHUB_OUTPUT

      - name: Ensure publishable version (multi-attempt)
        id: ensure-publishable-version
        run: |
          set -x
          bash "$RUNNER_TEMP/release-scripts/ensure-publishable-version.sh" "${{ inputs.release_type }}" "${{ inputs.max_attempts }}"

      - name: Log final package.json and selected tag
        run: |
          echo "Final package.json contents:"
          cat package.json
          echo "Selected release tag: v${{ steps.ensure-publishable-version.outputs.NPM_VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ensure-publishable-version.outputs.NPM_VERSION }}
          prerelease: ${{ inputs.release_type != 'latest' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Helper scripts are fetched into $RUNNER_TEMP rather than into the checkout.
  # This job runs `npm publish`, which fires the consuming repo's
  # `prepublishOnly` hook - typically `npm run lint && npm run build`. Anything
  # written into the working tree first is therefore linted as if it were the
  # repo's own source, and is also a candidate for the published tarball.
  publish:
    runs-on: ubuntu-latest
    needs: [create_github_release]
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download resolve-version-bump script
        if: ${{ inputs.release_type == 'latest' && inputs.version_override == '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-scripts"
          SCRIPT_NAME="resolve-version-bump.cjs"
          if [ "${{ inputs.is_esm }}" = "true" ]; then
            SCRIPT_NAME="resolve-version-bump-esm.js"
          fi
          wget -q "https://raw.githubusercontent.com/homebridge/.github/latest/.github/scripts/${SCRIPT_NAME}" -O "$RUNNER_TEMP/release-scripts/${SCRIPT_NAME}"
          chmod +x "$RUNNER_TEMP/release-scripts/${SCRIPT_NAME}" || true

      # Resolve how latest releases should bump version.
      # Priority: explicit workflow input > PR labels on the merged PR > patch.
      - name: Resolve version bump
        if: ${{ inputs.release_type == 'latest' && inputs.version_override == '' }}
        id: resolve_bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SCRIPT_NAME="resolve-version-bump.cjs"
          if [ "${{ inputs.is_esm }}" = "true" ]; then
            SCRIPT_NAME="resolve-version-bump-esm.js"
          fi
          node "$RUNNER_TEMP/release-scripts/${SCRIPT_NAME}" "${{ inputs.version_bump }}"

      # For major/minor on latest, compute explicit next version in workflow.
      # Patch remains handled by npm-version-script-*-auto.js.
      - name: Compute version override from bump
        if: ${{ inputs.release_type == 'latest' && inputs.version_override == '' && steps.resolve_bump.outputs.version_bump != 'patch' }}
        id: computed_override
        run: |
          mkdir -p "$RUNNER_TEMP/release-scripts"
          wget -q https://raw.githubusercontent.com/homebridge/.github/latest/.github/scripts/compute-version-override.cjs -O "$RUNNER_TEMP/release-scripts/compute-version-override.cjs"
          chmod +x "$RUNNER_TEMP/release-scripts/compute-version-override.cjs" || true
          BUMP_LEVEL="${{ steps.resolve_bump.outputs.version_bump }}"
          NEXT_VERSION=$(node "$RUNNER_TEMP/release-scripts/compute-version-override.cjs" "$BUMP_LEVEL")
          echo "Computed explicit ${BUMP_LEVEL} version: $NEXT_VERSION"
          echo "version_override=$NEXT_VERSION" >> $GITHUB_OUTPUT

      # Allows callers to pin an exact version instead of auto-bumping.
      - name: Apply explicit version override
        if: ${{ inputs.release_type == 'latest' && (inputs.version_override != '' || steps.computed_override.outputs.version_override != '') }}
        run: |
          VERSION_OVERRIDE="${{ inputs.version_override }}"
          if [ -z "$VERSION_OVERRIDE" ]; then
            VERSION_OVERRIDE="${{ steps.computed_override.outputs.version_override }}"
          fi
          echo "Using explicit version override: $VERSION_OVERRIDE"
          npm version "$VERSION_OVERRIDE" --no-git-tag-version

      - name: Adjust version (ESM)
        if: ${{ inputs.is_esm && inputs.version_override == '' && steps.computed_override.outputs.version_override == '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-scripts"
          wget -q https://raw.githubusercontent.com/homebridge/.github/latest/.github/scripts/npm-version-script-esm-auto.js -O "$RUNNER_TEMP/release-scripts/npm-version-script-esm-auto.js"
          chmod +x "$RUNNER_TEMP/release-scripts/npm-version-script-esm-auto.js" || true
          node "$RUNNER_TEMP/release-scripts/npm-version-script-esm-auto.js" ${{ github.ref }} ${{ inputs.release_type }}

      - name: Adjust version (CJS)
        if: ${{ !inputs.is_esm && inputs.version_override == '' && steps.computed_override.outputs.version_override == '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/release-scripts"
          wget -q https://raw.githubusercontent.com/homebridge/.github/latest/.github/scripts/npm-version-script-auto.cjs -O "$RUNNER_TEMP/release-scripts/npm-version-script-auto.cjs"
          chmod +x "$RUNNER_TEMP/release-scripts/npm-version-script-auto.cjs" || true
          node "$RUNNER_TEMP/release-scripts/npm-version-script-auto.cjs" ${{ github.ref }} ${{ inputs.release_type }}

      - name: Sync package.json to release version
        run: |
          set -euo pipefail
          RELEASE_VERSION="${{ needs.create_github_release.outputs.NPM_VERSION }}"
          if [ -z "$RELEASE_VERSION" ]; then
            echo "No release version found from create_github_release job"
            exit 1
          fi

          # Read current package.json version
          PKG_VERSION=$(node -p "require('./package.json').version")

          echo "Current package.json version: $PKG_VERSION"
          echo "Desired release version: $RELEASE_VERSION"

          if [ "$PKG_VERSION" = "$RELEASE_VERSION" ]; then
            echo "package.json already at $RELEASE_VERSION - skipping npm version"
          else
            echo "Setting package.json version to $RELEASE_VERSION"
            npm version "$RELEASE_VERSION" --no-git-tag-version
          fi

      - name: Log package.json before publish
        run: |
          echo "package.json before publish:"
          cat package.json

      - name: Publish to NPM
        run: npm publish --access public --tag=${{ inputs.release_type }} --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || '' }}

      - name: Return NPM Package Version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@v1.3.1

      - name: Published
        run: echo "::notice::Published on NPM - ${{ steps.package-version.outputs.current-version }}"

    outputs:
      NPM_VERSION: ${{ steps.package-version.outputs.current-version }}
