name: PR Target Beta

# Reusable check that fails when a pull request does not target a beta branch (beta-x.y.z).
# Release pull requests from a beta branch into latest are allowed.
#
# Caller example (.github/workflows/pr-target-beta.yml):
#
#   on:
#     pull_request_target:
#       types: [opened, reopened, edited, synchronize]
#   jobs:
#     check:
#       uses: homebridge/.github/.github/workflows/pr-target-beta.yml@latest

on:
  workflow_call:

jobs:
  check:
    name: PR Target Beta
    permissions: {}

    runs-on: ubuntu-latest

    steps:
      - name: Check base branch
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$BASE" == beta-* ]]; then
            echo "Targets $BASE"
            exit 0
          fi
          if [[ "$HEAD_REPO" == "$REPO" && "$HEAD" == beta-* ]]; then
            echo "Release pull request from $HEAD into $BASE"
            exit 0
          fi
          echo "::error::Pull requests must target the current beta branch (beta-x.y.z), not $BASE. Click Edit next to the title and change the base branch. If this repository has no beta branch, it will be moved during review."
          exit 1
