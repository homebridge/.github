name: PR Labeler

on:
  workflow_call:
    secrets:
      token:
        description: The GitHub Token
        required: false

jobs:
  label:
    name: PR Labeler
    permissions:
      contents: read
      pull-requests: write

    runs-on: ubuntu-latest

    steps:
      - uses: TimonVS/pr-labeler-action@v5
        env:
          # Use the secret this workflow actually declares, falling back to
          # the workflow's own token — the same pattern as labeler.yml.
          GITHUB_TOKEN: ${{ secrets.token || github.token }}
