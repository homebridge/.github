name: Update Version & Changelog

on:
  workflow_call:
    inputs:
      release_type:
        required: true
        type: string
      is_esm:
        required: true
        type: boolean
      version_bump:
        required: false
        type: string
        default: ''
      version_override:
        required: false
        type: string
        default: ''
    outputs:
      version:
        description: 'The new version number'
        value: ${{ jobs.update.outputs.version }}

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.final_version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Full history for changelog

      - name: Download resolve-version-bump script
        if: ${{ inputs.release_type == 'latest' && inputs.version_override == '' }}
        run: |
          mkdir -p .github/scripts
          SCRIPT_NAME="resolve-version-bump.cjs"
          if [ "${{ inputs.is_esm }}" = "true" ]; then
            SCRIPT_NAME="resolve-version-bump-esm.js"
          fi
          wget -q "https://raw.githubusercontent.com/homebridge/.github/latest/.github/scripts/${SCRIPT_NAME}" -O ".github/scripts/${SCRIPT_NAME}"
          chmod +x ".github/scripts/${SCRIPT_NAME}" || true

      # Resolve how latest releases should bump version.
      # Priority: explicit workflow input > PR labels on the merged PR > patch.
      - name: Resolve version bump
        if: ${{ inputs.release_type == 'latest' && inputs.version_override == '' }}
        id: resolve_bump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SCRIPT_NAME="resolve-version-bump.cjs"
          if [ "${{ inputs.is_esm }}" = "true" ]; then
            SCRIPT_NAME="resolve-version-bump-esm.js"
          fi
          node ".github/scripts/${SCRIPT_NAME}" "${{ inputs.version_bump }}"

      # For major/minor on latest, compute explicit next version in workflow.
      # Patch remains handled by npm-version-script-*-auto.js.
      - name: Compute version override from bump
        if: ${{ inputs.release_type == 'latest' && inputs.version_override == '' && steps.resolve_bump.outputs.version_bump != 'patch' }}
        id: computed_override
        run: |
          mkdir -p .github/scripts
          wget -q https://raw.githubusercontent.com/homebridge/.github/latest/.github/scripts/compute-version-override.cjs -O .github/scripts/compute-version-override.cjs
          chmod +x .github/scripts/compute-version-override.cjs || true
          BUMP_LEVEL="${{ steps.resolve_bump.outputs.version_bump }}"
          NEXT_VERSION=$(node .github/scripts/compute-version-override.cjs "$BUMP_LEVEL")
          echo "Computed explicit ${BUMP_LEVEL} version: $NEXT_VERSION"
          echo "version_override=$NEXT_VERSION" >> $GITHUB_OUTPUT

      # Allows callers to pin an exact version instead of auto-bumping.
      - name: Apply explicit version override
        if: ${{ inputs.release_type == 'latest' && (inputs.version_override != '' || steps.computed_override.outputs.version_override != '') }}
        run: |
          VERSION_OVERRIDE="${{ inputs.version_override }}"
          if [ -z "$VERSION_OVERRIDE" ]; then
            VERSION_OVERRIDE="${{ steps.computed_override.outputs.version_override }}"
          fi
          echo "[DEBUG] Using explicit version override: $VERSION_OVERRIDE"
          npm version "$VERSION_OVERRIDE" --no-git-tag-version
          echo "[DEBUG] package.json after explicit override:"
          cat package.json

      # Adjust version for ESM
      - name: Adjust version (ESM)
        if: ${{ inputs.is_esm && inputs.version_override == '' && steps.computed_override.outputs.version_override == '' }}
        run: |
          mkdir -p .github/scripts
          wget -q https://raw.githubusercontent.com/homebridge/.github/latest/.github/scripts/npm-version-script-esm-auto.js -O .github/scripts/npm-version-script-esm-auto.js
          chmod +x .github/scripts/npm-version-script-esm-auto.js || true
          node .github/scripts/npm-version-script-esm-auto.js ${{ github.ref }} ${{ inputs.release_type }}
          echo "[DEBUG] package.json after ESM version script:"
          cat package.json

      # Adjust version for CommonJS
      - name: Adjust version (CJS)
        if: ${{ !inputs.is_esm && inputs.version_override == '' && steps.computed_override.outputs.version_override == '' }}
        run: |
          mkdir -p .github/scripts
          wget -q https://raw.githubusercontent.com/homebridge/.github/latest/.github/scripts/npm-version-script-auto.cjs -O .github/scripts/npm-version-script-auto.cjs
          chmod +x .github/scripts/npm-version-script-auto.cjs || true
          node .github/scripts/npm-version-script-auto.cjs ${{ github.ref }} ${{ inputs.release_type }}
          echo "[DEBUG] package.json after CJS version script:"
          cat package.json

      # Finalize and export version
      - name: Export Version
        id: set_version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "[DEBUG] package.json at Export Version step:"
          cat package.json
          if [ -z "$VERSION" ]; then
            echo "Resolved package.json version is empty"
            exit 1
          fi
          echo "Final version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT


      # Ensure all tags are fetched for changelog generation
      - name: Fetch all tags
        if: ${{ inputs.release_type == 'latest' }}
        run: |
          git fetch --tags --force

      # Download changelog normalization script
      - name: Download changelog normalization script
        if: ${{ inputs.release_type == 'latest' }}
        run: |
          mkdir -p .github/scripts
          wget -q https://raw.githubusercontent.com/homebridge/.github/latest/.github/scripts/normalize-changelog-header.cjs -O .github/scripts/normalize-changelog-header.cjs
          chmod +x .github/scripts/normalize-changelog-header.cjs || true

      - name: Update Changelog
        if: ${{ inputs.release_type == 'latest' }}
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          git-message: 'chore(release): v${{ steps.set_version.outputs.version }}'
          git-user-name: 'github-actions'
          git-user-email: 'github-actions@github.com'
          tag-prefix: 'v'
          input-file: 'CHANGELOG.md'
          output-file: 'CHANGELOG.md'
          version-file: './package.json'
          version-path: 'version'
          pre-commit: '.github/scripts/normalize-changelog-header.cjs'
          skip-bump: 'true'
          skip-tag: 'true'
          skip-git-pull: 'true'


      # Download debug-print-changelog script
      - name: Download debug-print-changelog script
        if: ${{ inputs.release_type == 'latest' }}
        run: |
          mkdir -p .github/scripts
          wget -q https://raw.githubusercontent.com/homebridge/.github/latest/.github/scripts/debug-print-changelog.cjs -O .github/scripts/debug-print-changelog.cjs
          chmod +x .github/scripts/debug-print-changelog.cjs || true

      # Debug: Print contents of CHANGELOG.md after normalization
      - name: Debug print CHANGELOG.md
        if: ${{ inputs.release_type == 'latest' }}
        run: |
          node .github/scripts/debug-print-changelog.cjs


      # Export the final version after all optional release steps.
      # Write version to version.txt and upload as artifact for downstream jobs.
      - name: Export Final Version
        id: final_version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "[DEBUG] package.json at Export Final Version step:"
          cat package.json
          if [ -z "$VERSION" ]; then
            echo "Final package.json version is empty"
            exit 1
          fi
          echo "Final emitted version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [ "${{ inputs.release_type }}" = "latest" ] && [ "${{ steps.set_version.outputs.version }}" != "$VERSION" ]; then
            echo "Version changed unexpectedly during changelog step: ${{ steps.set_version.outputs.version }} -> $VERSION"
            exit 1
          fi
          echo "$VERSION" > version.txt

      - name: Upload version artifact
        uses: actions/upload-artifact@v7
        with:
          name: version
          path: version.txt

      # Upload package.json and package-lock.json as artifacts for downstream jobs
      - name: Upload package.json and lockfile
        uses: actions/upload-artifact@v7
        with:
          name: package-artifacts
          path: |
            package.json
            package-lock.json
