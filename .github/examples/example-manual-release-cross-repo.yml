name: Manual Release (Cross Repo Example)

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release channel
        required: true
        type: choice
        options:
          - latest
          - beta
          - alpha
        default: latest
      is_esm:
        description: Package is ESM
        required: true
        type: boolean
        default: false
      version_override:
        description: Exact version (for example 2.1.0). Leave empty for auto bump.
        required: false
        type: string
      version_bump:
        description: Auto bump type when version_override is empty
        required: false
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      max_attempts:
        description: Max retries for prerelease collision handling
        required: false
        type: number
        default: 5

permissions:
  contents: write
  id-token: write

jobs:
  update_version:
    uses: homebridge/.github/.github/workflows/update-version.yml@latest
    with:
      release_type: ${{ inputs.release_type }}
      is_esm: ${{ inputs.is_esm }}
      version_override: ${{ inputs.version_override }}
      version_bump: ${{ inputs.version_bump }}

  publish_release:
    needs: [update_version]
    uses: homebridge/.github/.github/workflows/publish-release.yml@latest
    with:
      release_type: ${{ inputs.release_type }}
      is_esm: ${{ inputs.is_esm }}
      version_override: ${{ inputs.version_override }}
      version_bump: ${{ inputs.version_bump }}
      max_attempts: ${{ inputs.max_attempts }}
